name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check _MSYS_
        shell: bash
        run: |
          which gcc
          gcc -v
          echo "#include <_mingw.h>" | gcc -dM -E - | grep -e __MINGW -e MSYS || true

      - uses: ruby/setup-ruby@80740b3b13bf9857e28854481ca95a84e78a2bdf # v1.284.0
        with:
          ruby-version: 3.4

      - name: Check _MSYS_
        shell: bash
        run: |
          which gcc
          gcc -v
          echo "#include <_mingw.h>" | gcc -dM -E - | grep -e __MINGW -e MSYS || true

