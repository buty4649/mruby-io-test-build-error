name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Find and Inspect stdlib.h
        shell: bash
        run: |
          # GCCの検索パス一覧を取得し、その中から stdlib.h が存在するディレクトリを特定する
          # 大文字小文字の違いや、C:/ と /c/ の違いを無視するために tr と grep -i を活用
          
          echo "=== Detecting Include Paths ==="
          PATHS=$(echo | gcc -Wp,-v -E - 2>&1 | grep "^ " | sed 's/^ //g')
          echo "$PATHS"
          
          STDLIB_PATH=""
          for p in $PATHS; do
            # Windows形式のパスをUnix形式に変換しつつ、stdlib.hを探す
            unix_p=$(echo "$p" | sed -e 's/\\/\//g' -e 's/^\([A-Za-z]\):/\/\1/')
            if [ -f "$unix_p/stdlib.h" ]; then
              STDLIB_PATH="$unix_p/stdlib.h"
              break
            fi
          done

          if [ -z "$STDLIB_PATH" ]; then
            echo "❌ Error: stdlib.h not found in any include path."
            exit 1
          fi

          echo "=== Target Header Found ==="
          echo "Path: $STDLIB_PATH"

          echo "=== Checking for mkdtemp definition ==="
          # 大文字小文字を区別せず検索
          if grep -i "mkdtemp" "$STDLIB_PATH"; then
            echo "✅ mkdtemp keyword found!"
            echo "--- Context ---"
            grep -i -C 5 "mkdtemp" "$STDLIB_PATH"
          else
            echo "❌ mkdtemp NOT found in $STDLIB_PATH"
            echo "--- Beginning of file (first 50 lines) ---"
            head -n 50 "$STDLIB_PATH"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - uses: ruby/setup-ruby@80740b3b13bf9857e28854481ca95a84e78a2bdf # v1.284.0
        with:
          ruby-version: 3.4
      - run: |
          set -x
          which gcc
          gcc -v
          echo "#include <_mingw.h>" | gcc -dM -E - | grep __MINGW | grep VERSION || true
          echo "#include <stdlib.h>" | gcc -D_GNU_SOURCE -E -dD - | grep mkdtemp
        shell: bash
