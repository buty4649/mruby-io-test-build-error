name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Run build and tests(default)
        run: rake -f mruby/Rakefile -m test:run:serial
        env:
          MRUBY_CONFIG: default
